# الفحص الدوري — ما فات النشرَ يُنشر، وما ضاعت إشارته يُبنى
#
# البناء لا يبدأ إلا عند الحفظ في مستودع المحتوى. إن ضاعت إشارة حفظ (رمز
# BUILD_TRIGGER_TOKEN منتهٍ، عطل في GitHub) لم يُنشر شيء ولم يعلم أحد، وإن فشل
# بناء لعطل عابر بقي فاشلًا حتى يحفظ الكاتب شيئًا آخر. لم يكن في هذه المدونة
# أي فحص احتياطي قبل 2026-11-14.
#
# كل ساعة: tools/schedule_check.py يقرأ المحتوى وتاريخ تشغيلات build.yml،
# ويطلب build.yml (بالبوابات كلها) إن لم يُبنَ آخر محتوى، أو فشل آخر بناء
# قبل أكثر من ساعة (ثلاث محاولات بحدّ أقصى)، أو حلّ موعد مقال مؤرَّخ لاحقًا.
# وحين يبني محتوى ضاعت إشارته يُبلَّغ المالك (انظر tools/blog_report.py).
#
# ملف مستقل عن build.yml عمدًا: GitHub يعطّل سير العمل المجدول في المستودع
# العام بعد 60 يومًا بلا نشاط — ولو كان الجدول داخل build.yml لتعطّل النشر
# كله معه. هنا يتعطّل الجدول وحده، ومهمة الإبلاغ في build.yml تعيد تفعيله مع
# أول حفظة من الكاتب.
#
# نُقل من مدونة zero2one.sa (يعمل هناك منذ أكتوبر 2026).
name: schedule
run-name: فحص الإشارات الفائتة والبناء الفاشل

on:
  schedule:
    # الدقيقة 23 لا رأس الساعة: GitHub يؤخّر الجداول عند رؤوس الساعات،
    # ومدونة zero2one.sa على الدقيقة 17 فلا يتزامن الطلبان.
    - cron: '23 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: blog-schedule
  cancel-in-progress: true

jobs:
  due:
    name: هل فات النشرَ شيء؟
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: أدوات المدونة
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: المحتوى
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zeroone01z21-alt/datarecovery-blog-content
          ref: main
          path: .content-src
          persist-credentials: false

      - name: القرار والطلب
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/schedule_check.py --content .content-src --dispatch
